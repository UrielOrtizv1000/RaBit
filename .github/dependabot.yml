version: 2

# There is no github-actions entry on purpose: the repository has no workflow
# files, and a block with no dependency file to resolve fails the scheduled run
# with `dependency_file_not_found`. Add it back together with the first
# workflow.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps arrive together. A major stays on its own pull
      # request so it can be read against the upgrade notes for React, Vite or
      # Tauri instead of being buried in a batch.
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
