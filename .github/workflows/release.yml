# Las acciones de terceros están fijadas por SHA (no por etiqueta): este workflow tiene acceso a la clave de firma.
# Publica una versión de RaBit cuando se crea un tag `v*` (p. ej. v1.3.0).
#
# Compila para Windows, macOS y Linux (x86_64), FIRMA los artefactos del actualizador y sube al release los instaladores y el
# `latest.json` que las apps instaladas consultan para actualizarse solas. Pasos y secretos: docs/UPDATES.md.
#
# Secretos del repositorio necesarios:
#   TAURI_SIGNING_PRIVATE_KEY            contenido de la clave privada (npx tauri signer generate)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   su contraseña (GitHub no admite secretos vacíos: si la clave no tiene contraseña, no lo crees)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # package.json, tauri.conf.json y Cargo.toml deben estar en la misma versión que el tag
      - run: npm run release:check -- "${{ github.ref_name }}"
      - run: npm run typecheck
      - run: npm test
      # Las notas del release (lo que la app muestra como "What's new") salen de CHANGELOG.md
      - id: notes
        run: |
          {
            echo 'notes<<RABIT_NOTES_EOF'
            node scripts/release-notes.mjs "${{ github.ref_name }}"
            echo 'RABIT_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

  publish:
    name: Build ${{ matrix.label }}
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - label: Linux
            os: ubuntu-22.04 # la distro más antigua soportada: el AppImage enlaza contra su glibc
            args: ""
            rust_targets: ""
          - label: macOS (universal)
            os: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "src-tauri -> target"
      # Dependencias de sistema de Tauri 2 (las mismas que el README y el job `linux` de ci.yml)
      - if: matrix.label == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential curl wget file patchelf libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "RaBit ${{ github.ref_name }}"
          releaseBody: ${{ needs.checks.outputs.notes }}
          releaseDraft: false
          prerelease: false
          # genera y sube latest.json (versión, notas, URLs y firmas por plataforma)
          includeUpdaterJson: true
          args: ${{ matrix.args }}
      # Copia con nombre fijo (RaBit-Setup.exe) para que el botón de descarga del README no cambie entre versiones
      - if: matrix.label == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          cp "$f" RaBit-Setup.exe
          gh release upload "${{ github.ref_name }}" RaBit-Setup.exe --clobber
      # Linux: copias con nombre fijo (el AppImage es el único que se actualiza solo) y sumas SHA-256 de todo
      - if: matrix.label == 'Linux'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          b=src-tauri/target/release/bundle
          cp "$(ls $b/appimage/*.AppImage | head -n 1)" RaBit-x86_64.AppImage
          cp "$(ls $b/deb/*.deb | head -n 1)" RaBit-x86_64.deb
          cp "$(ls $b/rpm/*.rpm | head -n 1)" RaBit-x86_64.rpm
          sha256sum RaBit-x86_64.AppImage RaBit-x86_64.deb RaBit-x86_64.rpm > SHA256SUMS-linux.txt
          gh release upload "${{ github.ref_name }}" RaBit-x86_64.AppImage RaBit-x86_64.deb RaBit-x86_64.rpm SHA256SUMS-linux.txt --clobber

  verify:
    name: Verify updater manifest
    needs: publish
    runs-on: ubuntu-latest
    steps:
      # Si latest.json falta, no es de esta versión o no trae firma de Windows o de Linux, las apps instaladas no podrían actualizarse
      - name: Check latest.json
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/latest.json" -o latest.json
          jq -e --arg v "${GITHUB_REF_NAME#v}" '.version == $v and ((.platforms["windows-x86_64"].signature // "") | length > 0) and ((.platforms["linux-x86_64"].signature // "") | length > 0)' latest.json
          curl -fsSIL -o /dev/null "$(jq -r '.platforms["windows-x86_64"].url' latest.json)"
          curl -fsSIL -o /dev/null "$(jq -r '.platforms["linux-x86_64"].url' latest.json)"
